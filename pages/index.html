<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot API 用量仪表盘</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe7;
        --bg-accent: #efe6d9;
        --surface: rgba(255, 252, 247, 0.88);
        --surface-strong: #fffdf9;
        --panel: rgba(19, 52, 59, 0.06);
        --panel-strong: #f1ece3;
        --line: rgba(22, 55, 63, 0.12);
        --line-strong: rgba(22, 55, 63, 0.2);
        --text: #16252b;
        --muted: #5e6d72;
        --brand: #16606e;
        --brand-strong: #0f4b56;
        --brand-soft: rgba(22, 96, 110, 0.12);
        --success: #167a62;
        --success-soft: rgba(22, 122, 98, 0.12);
        --warning: #b2681f;
        --warning-soft: rgba(178, 104, 31, 0.14);
        --danger: #b2473f;
        --danger-soft: rgba(178, 71, 63, 0.14);
        --shadow: 0 24px 60px rgba(16, 39, 45, 0.08);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Noto Sans SC", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(22, 96, 110, 0.14), transparent 30%),
          radial-gradient(circle at top right, rgba(178, 104, 31, 0.12), transparent 32%),
          linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
        color: var(--text);
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
      }

      .page-shell::before {
        content: "";
        position: fixed;
        inset: auto -10vw -22vh auto;
        width: 30rem;
        height: 30rem;
        background: radial-gradient(circle, rgba(22, 96, 110, 0.12), transparent 72%);
        pointer-events: none;
        filter: blur(10px);
      }

      .dashboard-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface);
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
      }

      .dashboard-card-strong {
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-xl);
        background: linear-gradient(180deg, rgba(255, 253, 249, 0.98), rgba(248, 243, 235, 0.94));
        box-shadow: var(--shadow);
      }

      .metric-card {
        position: relative;
        overflow: hidden;
      }

      .metric-card::after {
        content: "";
        position: absolute;
        inset: auto -32px -42px auto;
        width: 110px;
        height: 110px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .section-icon,
      .inline-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .section-icon svg,
      .inline-icon svg {
        width: 100%;
        height: 100%;
      }

      .section-icon {
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 14px;
        background: var(--brand-soft);
        color: var(--brand);
      }

      .inline-icon {
        width: 1.05rem;
        height: 1.05rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        color: var(--brand);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.42rem 0.7rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .pill-neutral {
        background: rgba(22, 37, 43, 0.06);
        border-color: rgba(22, 37, 43, 0.08);
        color: var(--text);
      }

      .pill-brand {
        background: var(--brand-soft);
        border-color: rgba(22, 96, 110, 0.12);
        color: var(--brand);
      }

      .pill-success {
        background: var(--success-soft);
        border-color: rgba(22, 122, 98, 0.14);
        color: var(--success);
      }

      .pill-warning {
        background: var(--warning-soft);
        border-color: rgba(178, 104, 31, 0.18);
        color: var(--warning);
      }

      .pill-danger {
        background: var(--danger-soft);
        border-color: rgba(178, 71, 63, 0.2);
        color: var(--danger);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 0.9rem 1.25rem;
        font-size: 0.95rem;
        font-weight: 700;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease,
          background-color 0.18s ease,
          color 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:focus-visible,
      .input-field:focus-visible,
      .tab-button:focus-visible,
      .segment-button:focus-visible,
      .lang-toggle:focus-visible,
      summary:focus-visible,
      .switch-input:focus-visible + .switch-track {
        outline: 3px solid rgba(22, 96, 110, 0.24);
        outline-offset: 3px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--brand), var(--brand-strong));
        color: #f7fbfc;
        box-shadow: 0 12px 24px rgba(15, 75, 86, 0.18);
      }

      .btn-primary:hover {
        box-shadow: 0 16px 28px rgba(15, 75, 86, 0.24);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.7);
        border-color: var(--line);
        color: var(--text);
      }

      .btn-secondary:hover {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.95);
      }

      .lang-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 84px;
        padding: 0.78rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        color: var(--text);
        font-size: 0.88rem;
        font-weight: 700;
        transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      }

      .lang-toggle:hover {
        transform: translateY(-1px);
        border-color: var(--line-strong);
      }

      .input-field {
        width: 100%;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        padding: 1rem 1.1rem;
        font-size: 0.97rem;
        color: var(--text);
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      }

      .input-field:hover {
        border-color: var(--line-strong);
      }

      .input-field::placeholder {
        color: rgba(94, 109, 114, 0.9);
      }

      .helper-text {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .status-dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 999px;
        display: inline-block;
      }

      .status-loading {
        background: var(--warning);
        box-shadow: 0 0 0 8px rgba(178, 104, 31, 0.12);
      }

      .status-success {
        background: var(--success);
        box-shadow: 0 0 0 8px rgba(22, 122, 98, 0.12);
      }

      .status-error {
        background: var(--danger);
        box-shadow: 0 0 0 8px rgba(178, 71, 63, 0.12);
      }

      .status-idle {
        background: rgba(94, 109, 114, 0.75);
        box-shadow: 0 0 0 8px rgba(94, 109, 114, 0.1);
      }

      .progress-track {
        width: 100%;
        height: 0.72rem;
        border-radius: 999px;
        background: rgba(22, 37, 43, 0.08);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: inherit;
        transition: width 0.35s ease;
      }

      .progress-fill-brand {
        background: linear-gradient(90deg, #208193, #16606e);
      }

      .progress-fill-success {
        background: linear-gradient(90deg, #2a9b78, #167a62);
      }

      .progress-fill-warning {
        background: linear-gradient(90deg, #d58b3f, #b2681f);
      }

      .progress-fill-danger {
        background: linear-gradient(90deg, #d76a63, #b2473f);
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
      }

      .banner {
        border-radius: 20px;
        border: 1px solid var(--line);
        padding: 1rem 1.15rem;
      }

      .banner-info {
        background: rgba(22, 96, 110, 0.08);
        border-color: rgba(22, 96, 110, 0.16);
      }

      .banner-error {
        background: rgba(178, 71, 63, 0.1);
        border-color: rgba(178, 71, 63, 0.2);
      }

      .switch {
        display: inline-flex;
        align-items: center;
        gap: 0.85rem;
      }

      .switch-input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      .switch-track {
        position: relative;
        width: 3.2rem;
        height: 1.8rem;
        border-radius: 999px;
        background: rgba(22, 37, 43, 0.14);
        transition: background-color 0.18s ease;
      }

      .switch-track::after {
        content: "";
        position: absolute;
        top: 0.2rem;
        left: 0.22rem;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 6px 14px rgba(15, 30, 35, 0.12);
        transition: transform 0.2s ease;
      }

      .switch-input:checked + .switch-track {
        background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      }

      .switch-input:checked + .switch-track::after {
        transform: translateX(1.38rem);
      }

      .auto-refresh-controls {
        display: grid;
        gap: 0.9rem;
      }

      .auto-refresh-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .auto-refresh-summary {
        min-height: 2.4rem;
      }

      .refresh-preset-group {
        display: grid;
        gap: 0.5rem;
      }

      .refresh-preset-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .segment-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3rem;
        padding: 0.7rem 0.9rem;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          background-color 0.18s ease,
          color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .segment-button:hover {
        transform: translateY(-1px);
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.94);
        color: var(--text);
      }

      .segment-button.is-active {
        border-color: rgba(22, 96, 110, 0.3);
        background: linear-gradient(135deg, rgba(22, 96, 110, 0.18), rgba(22, 96, 110, 0.06)), rgba(255, 255, 255, 0.98);
        color: var(--brand-strong);
        box-shadow: 0 12px 22px rgba(15, 30, 35, 0.08);
      }

      .refresh-custom-field {
        display: grid;
        gap: 0.55rem;
        padding: 0.9rem 1rem;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.52);
      }

      .refresh-custom-field .input-field {
        max-width: none;
        min-height: 3rem;
        padding: 0.85rem 1rem;
      }

      .tab-button {
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 0.65rem 0.95rem;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--muted);
        transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
      }

      .tab-button.is-active {
        background: rgba(255, 255, 255, 0.92);
        border-color: var(--line);
        color: var(--text);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.is-active {
        display: block;
      }

      .code-panel {
        border-radius: 20px;
        border: 1px solid var(--line);
        background: #182428;
        color: #eef4f5;
        max-height: 24rem;
        overflow: auto;
      }

      .code-panel pre {
        margin: 0;
        padding: 1.1rem 1.15rem;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.82rem;
        line-height: 1.65;
      }

      .details-panel[open] summary {
        margin-bottom: 1rem;
      }

      summary {
        list-style: none;
        cursor: pointer;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      .details-chevron {
        transition: transform 0.18s ease;
      }

      .details-panel[open] .details-chevron {
        transform: rotate(180deg);
      }

      .empty-illustration {
        width: 4rem;
        height: 4rem;
        border-radius: 20px;
        background: rgba(22, 96, 110, 0.08);
        color: var(--brand);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .loading-bar {
        position: relative;
        overflow: hidden;
      }

      .loading-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.68), transparent);
        transform: translateX(-100%);
        animation: shimmer 1.3s infinite;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @media (min-width: 640px) {
        .refresh-preset-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 768px) {
        .dashboard-card-strong,
        .dashboard-card {
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell px-4 py-5 sm:px-6 lg:px-8 lg:py-8">
      <div class="mx-auto max-w-7xl space-y-5 sm:space-y-6">
        <header class="dashboard-card-strong overflow-hidden px-5 py-5 sm:px-7 sm:py-7 lg:px-8 lg:py-8">
          <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
            <div class="max-w-3xl space-y-4">
              <span class="eyebrow">
                <span class="inline-icon h-4 w-4" aria-hidden="true" id="badge-icon"></span>
                <span id="eyebrow-text"></span>
              </span>
              <div class="space-y-3">
                <div class="flex flex-wrap items-center gap-3">
                  <h1 class="text-3xl font-extrabold tracking-tight text-[var(--text)] sm:text-4xl lg:text-[2.9rem]" id="page-title"></h1>
                  <span class="pill pill-brand" id="mode-chip"></span>
                </div>
                <p class="max-w-2xl text-sm leading-7 text-[var(--muted)] sm:text-base" id="page-subtitle"></p>
              </div>
              <div class="flex flex-wrap gap-2" id="hero-tags"></div>
            </div>

            <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center lg:flex-col lg:items-end">
              <button id="lang-toggle" type="button" class="lang-toggle">EN</button>
              <div class="dashboard-card px-4 py-3 text-sm text-[var(--muted)]">
                <div class="font-semibold text-[var(--text)]" id="quick-tip-title"></div>
                <p class="mt-1 max-w-xs leading-6" id="quick-tip-body"></p>
              </div>
            </div>
          </div>
        </header>

        <section class="dashboard-card px-5 py-5 sm:px-6 sm:py-6" aria-labelledby="connection-title">
          <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
            <div class="max-w-2xl space-y-2">
              <div class="section-title text-xl text-[var(--text)]">
                <span class="section-icon" aria-hidden="true" id="connection-icon"></span>
                <span id="connection-title"></span>
              </div>
              <p class="text-sm leading-7 text-[var(--muted)]" id="connection-subtitle"></p>
            </div>
            <div class="flex flex-wrap gap-2" id="connection-chips"></div>
          </div>

          <form id="endpoint-form" class="mt-5 space-y-4">
            <div class="grid gap-3 lg:grid-cols-[minmax(0,1fr)_auto_auto_auto]">
              <label for="endpoint-input" class="sr-only" id="endpoint-label"></label>
              <input
                id="endpoint-input"
                class="input-field mono"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="http://localhost:4141/usage"
              />
              <button id="fetch-button" type="submit" class="btn btn-primary">
                <span class="inline-icon h-4 w-4" aria-hidden="true" id="refresh-icon"></span>
                <span id="fetch-button-text"></span>
              </button>
              <button id="reset-button" type="button" class="btn btn-secondary">
                <span class="inline-icon h-4 w-4" aria-hidden="true" id="reset-icon"></span>
                <span id="reset-button-text"></span>
              </button>
              <button id="export-button" type="button" class="btn btn-secondary">
                <span class="inline-icon h-4 w-4" aria-hidden="true" id="export-icon"></span>
                <span id="export-button-text"></span>
              </button>
            </div>
            <div class="flex flex-col gap-2 text-sm text-[var(--muted)] sm:flex-row sm:items-center sm:justify-between">
              <p id="endpoint-hint"></p>
              <p class="mono text-xs sm:text-sm" id="endpoint-current"></p>
            </div>
          </form>
        </section>

        <section aria-labelledby="overview-title" class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 id="overview-title" class="text-xl font-bold tracking-tight text-[var(--text)]"></h2>
            <p class="text-sm text-[var(--muted)]" id="overview-caption"></p>
          </div>
          <div id="overview-grid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-4"></div>
        </section>

        <div id="status-banner" aria-live="polite"></div>

        <main id="content-area" class="space-y-5" aria-live="polite"></main>

        <footer class="pb-3 text-center text-xs leading-6 text-[var(--muted)] sm:text-sm" id="footer-note"></footer>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const DEFAULT_ENDPOINT = "http://localhost:4141/usage";
        const DEFAULT_REFRESH_PRESET = "60";
        const MIN_CUSTOM_REFRESH_SECONDS = 5;

        const ICONS = {
          dashboard:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.2a9 9 0 1 1 18 0"/><path d="M12 13l4.2-4.2"/><path d="M7.5 16.5h9"/></svg>',
          link:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 1 0-7l1.5-1.5a5 5 0 1 1 7 7L17 13"/><path d="M14 11a5 5 0 0 1 0 7L12.5 19.5a5 5 0 0 1-7-7L7 11"/></svg>',
          refresh:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.3 6.36"/><path d="M3 12A9 9 0 0 1 18.3 5.64"/><path d="M3 17v-4h4"/><path d="M17 3h4v4"/></svg>',
          reset:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10"/><path d="M6 6h.01"/><path d="M6 12h.01"/><path d="M6 18h.01"/><path d="M10 12h10"/><path d="M10 18h10"/></svg>',
          export:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="m8.5 10.5 3.5 3.5 3.5-3.5"/><path d="M5 16.5v1a2.5 2.5 0 0 0 2.5 2.5h9A2.5 2.5 0 0 0 19 17.5v-1"/></svg>',
          status:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2.2-5 3.6 10L16 12h4"/></svg>',
          mode:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>',
          clock:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.8"/></svg>',
          auto:

        const STORAGE_KEYS = {

        };

        const REFRESH_PRESETS = ["30", "60", "120", "custom"];

        function readStoredValue(key, fallback = "") {
          try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : value;
          } catch {
            return fallback;
          }
        }

        function readStoredNumber(key, fallback) {
          const value = Number(readStoredValue(key, String(fallback)));
          return Number.isFinite(value) ? value : fallback;
        }

        function getValidLanguage(value) {
          return value === "en" ? "en" : "zh";
        }

        function getValidRefreshPreset(value) {
          return REFRESH_PRESETS.includes(value) ? value : DEFAULT_REFRESH_PRESET;
        }

        function readQueryParams() {
          try {
            return new URLSearchParams(window.location.search);
          } catch {
            return null;
          }
        }

        function readQueryValue(params, key) {
          if (!params) return null;
          const value = params.get(key);
          return value === null ? null : value.trim();
        }

        function readQueryBoolean(params, key) {
          const value = readQueryValue(params, key);
          if (value === null) return null;
          const normalized = value.toLowerCase();
          if (["1", "true", "yes", "on"].includes(normalized)) return true;
          if (["0", "false", "no", "off"].includes(normalized)) return false;
          return null;
        }

        const queryParams = readQueryParams();
        const queryLanguage = (() => {
          const value = readQueryValue(queryParams, "lang");
          return value === "zh" || value === "en" ? value : null;
        })();
        const queryEndpoint = (() => {

          return value ? getNormalizedEndpoint(value) : "";

          return value !== null && REFRESH_PRESETS.includes(value) ? value : null;

        function text(key, replacements = {}) {
          const dictionary = I18N[state.language] || I18N.zh;
          const template = dictionary[key] || I18N.en[key] || key;
          return Object.entries(replacements).reduce(
            (value, [token, replacement]) => value.replaceAll(`{${token}}`, replacement),
            template,
          );
        }

        function icon(name, className = "h-4 w-4") {
          return `<span class="inline-icon ${className}" aria-hidden="true">${ICONS[name] || ""}</span>`;
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function formatDateTime(value) {
          if (!value) return text("neverUpdated");
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return String(value);
          return new Intl.DateTimeFormat(state.language === "zh" ? "zh-CN" : "en-US", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          }).format(date);
        }

        function formatNumber(value) {
          if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return text("noValue");
          }
          return new Intl.NumberFormat(state.language === "zh" ? "zh-CN" : "en-US").format(
            Number(value),
          );
        }

        function formatPercent(value) {
          if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return text("noValue");
          }
          return `${Math.round(Number(value))}%`;
        }

        function getMode(data) {
          if (!data || typeof data !== "object") return "unknown";
          if (data.mode === "zen") return "zen";
          if (data.copilot_plan === "antigravity" || data.quota_snapshots?.models) {
            return "antigravity";

          if (data.quota_snapshots) return "copilot";
          return "unknown";
        }

        function getModeLabel(mode) {

          if (state.status === "loading") {

          if (state.status === "success") {

          if (state.status === "error") {

          }
          return {
            label: text("statusIdle"),
            dotClass: "status-idle",
            pillClass: "pill-neutral",
          };
        }

        function getProgressTone(percentUsed, unlimited = false) {
          if (unlimited) return "progress-fill-brand";
          if (percentUsed >= 90) return "progress-fill-danger";
          if (percentUsed >= 75) return "progress-fill-warning";
          if (percentUsed >= 45) return "progress-fill-brand";
          return "progress-fill-success";
        }

        function getHealthLabel(percentRemaining) {
          const number = Number(percentRemaining);
          if (number <= 15) return { text: text("modelCritical"), className: "pill-danger" };
          if (number <= 40) return { text: text("modelWarning"), className: "pill-warning" };
          return { text: text("modelHealthy"), className: "pill-success" };
        }

        function getNormalizedEndpoint(value) {
          const trimmed = value.trim();
          if (!trimmed) return "";
          try {
            return new URL(trimmed).toString();
          } catch {
            return "";
          }
        }

        function updateUrl(endpoint) {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set("endpoint", endpoint);
            window.history.replaceState({}, "", url);
          } catch (error) {
            console.warn("Failed to update URL", error);
          }
        }

        function getExportBaseUrl(endpoint) {
          const normalized = getNormalizedEndpoint(endpoint);
          if (!normalized) return "";

          try {
            const url = new URL(normalized);
            const pathname = url.pathname.replace(/\/usage\/?$/, "");
            return `${url.origin}${pathname === "/" ? "" : pathname}`;
          } catch {
            return normalized.replace(/[?#].*$/, "").replace(/\/usage\/?$/, "");
          }
        }

        function buildExportConfigJson() {
          const baseUrl = getExportBaseUrl(state.endpoint) || state.endpoint;
          return JSON.stringify(
            {
              env: {
                ANTHROPIC_BASE_URL: baseUrl,
                ANTHROPIC_AUTH_TOKEN: "dummy",
                ANTHROPIC_MODEL: "claude-sonnet-4",
                ANTHROPIC_SMALL_FAST_MODEL: "gpt-4.1",
                DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1",
              },
            },
            null,
            2,
          );
        }

        function copyTextWithExecCommand(value) {
          const textArea = document.createElement("textarea");
          textArea.value = value;
          textArea.setAttribute("readonly", "readonly");
          textArea.style.position = "fixed";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          textArea.setSelectionRange(0, textArea.value.length);

          try {
            return document.execCommand("copy");
          } catch {
            return false;
          } finally {
            textArea.remove();
          }
        }

        async function copyTextToClipboard(value) {
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(value);
              return true;
            } catch (error) {
              console.warn("Failed to copy with navigator.clipboard", error);
            }
          }
          return copyTextWithExecCommand(value);
        }

        function setExportFeedback(labelKey) {
          refs.exportButtonText.textContent = text(labelKey);

        function clampCustomRefreshSeconds(value) {
          const parsed = Number(value);
          if (!Number.isFinite(parsed)) return 60;
          return Math.max(MIN_CUSTOM_REFRESH_SECONDS, Math.round(parsed));

        function getRefreshIntervalSeconds() {
          if (state.refreshIntervalPreset === "custom") {
            return clampCustomRefreshSeconds(state.customRefreshSeconds);

          const presetValue = Number(state.refreshIntervalPreset);
          return Number.isFinite(presetValue) ? presetValue : Number(DEFAULT_REFRESH_PRESET);

            refs.contentArea.innerHTML = renderEmptyState({
              title: text("requestFailed"),
              body: state.error || text("networkErrorFallback"),
              actionLabel: text("retry"),
              action: "retry",
              tone: "error",

        function renderAntigravitySection(data) {
          const models = data.quota_snapshots?.models || {};
          const entries = Object.entries(models);
          const grouped = {
            gemini: [],
            claude: [],
            other: [],

          for (const [modelId, quota] of entries) {
            if (modelId.startsWith("gemini") || modelId.startsWith("learnlm")) {
              grouped.gemini.push([modelId, quota]);

              grouped.other.push([modelId, quota]);

            `<span class="pill pill-neutral">${icon("other")}${escapeHtml(text("antigravityOther"))}: ${escapeHtml(formatNumber(grouped.other.length))}</span>`,

          const renderGroup = (titleKey, iconName, items, pillClass) => {
            if (!items.length) return "";
            const cards = items
              .map(([modelId, quota]) => {
                const percentRemaining = Number(quota.percent_remaining || 0);
                const health = getHealthLabel(percentRemaining);
                return `

                    <div class="mt-4 space-y-2">
                      <div class="flex items-center justify-between text-sm text-[var(--muted)]">
                        <span>${escapeHtml(text("modelRemaining"))}</span>
                        <span class="mono font-semibold text-[var(--text)]">${escapeHtml(formatPercent(percentRemaining))}</span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill ${getProgressTone(100 - percentRemaining)}" style="width: ${percentRemaining}%"></div>
                      </div>
                    </div>
                  </article>
                `;
              })
              .join("");

            return `
              <section class="space-y-3">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="section-title text-lg text-[var(--text)]">
                    <span class="section-icon h-10 w-10">${ICONS[iconName]}</span>
                    <span>${escapeHtml(text(titleKey))}</span>
                  </h3>
                  <span class="pill ${pillClass}">${escapeHtml(formatNumber(items.length))}</span>
                </div>
                <div class="grid gap-4 xl:grid-cols-2">${cards}</div>
              </section>
            `;
          };

          const mainPanel = entries.length
            ? [
                renderGroup("antigravityGemini", "spark", grouped.gemini, "pill-brand"),
                renderGroup("antigravityClaude", "claude", grouped.claude, "pill-warning"),
                renderGroup("antigravityOther", "other", grouped.other, "pill-neutral"),
              ]
                .filter(Boolean)
                .join("")
            : `
                <div class="dashboard-card p-7 text-center">
                  <div class="mx-auto empty-illustration">${ICONS.info}</div>
                  <h3 class="mt-4 text-xl font-bold text-[var(--text)]">${escapeHtml(text("antigravityEmptyTitle"))}</h3>
                  <p class="mx-auto mt-2 max-w-2xl text-sm leading-7 text-[var(--muted)] sm:text-base">${escapeHtml(text("antigravityEmptyBody"))}</p>
                </div>
              `;

          return `
            <section class="space-y-5">
              <div class="dashboard-card-strong p-6 sm:p-7">
                <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                  <div class="max-w-2xl space-y-3">
                    <div class="section-title text-2xl text-[var(--text)]">
                      <span class="section-icon">${ICONS.spark}</span>
                      <span>${escapeHtml(text("antigravitySectionTitle"))}</span>
                    </div>
                    <p class="text-sm leading-7 text-[var(--muted)] sm:text-base">${escapeHtml(text("antigravitySectionBody"))}</p>
                  </div>
                  <div class="rounded-[22px] border border-[var(--line)] bg-white/70 px-4 py-3 text-sm text-[var(--muted)]">
                    <div class="font-semibold text-[var(--text)]">${escapeHtml(text("quotaReset"))}</div>
                    <div class="mt-1 mono">${escapeHtml(data.quota_reset_date ? formatDateTime(data.quota_reset_date) : text("noValue"))}</div>
                  </div>
                </div>
                <div class="mt-5 flex flex-wrap gap-2">
                  <span class="pill pill-brand">${icon("chart")}${escapeHtml(text("antigravityTotalModels"))}: ${escapeHtml(formatNumber(entries.length))}</span>
                  ${counts}
                </div>
              </div>

              <div class="space-y-5">${mainPanel}</div>
            </section>
          `;
        }

        function renderZenSection(data) {
          return `
            <section class="dashboard-card-strong p-6 sm:p-7 lg:p-8">
              <div class="grid gap-6 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,0.8fr)] lg:items-start">
                <div class="space-y-4">
                  <span class="pill pill-brand">${icon("mode")}${escapeHtml(getModeLabel("zen"))}</span>
                  <div>
                    <h2 class="text-3xl font-bold tracking-tight text-[var(--text)]">${escapeHtml(text("zenSectionTitle"))}</h2>
                    <p class="mt-3 text-sm leading-7 text-[var(--muted)] sm:text-base">${escapeHtml(text("zenSectionBody"))}</p>
                  </div>
                  <div class="rounded-[22px] border border-[var(--line)] bg-white/75 p-4">
                    <p class="font-semibold text-[var(--text)]">${escapeHtml(data.message || text("zenMessageFallback"))}</p>
                    <p class="mt-2 text-sm leading-6 text-[var(--muted)]">${escapeHtml(text("zenHint"))}</p>
                  </div>
                </div>

                <div class="dashboard-card p-5 sm:p-6">
                  <div class="flex items-center gap-3">
                    <span class="section-icon">${ICONS.external}</span>
                    <div>
                      <p class="font-bold text-[var(--text)]">OpenCode</p>
                      <p class="text-sm text-[var(--muted)]">${escapeHtml(text("zenMessageFallback"))}</p>
                    </div>
                  </div>
                  <a
                    href="https://console.opencode.ai"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-primary mt-5 w-full"
                  >
                    ${icon("external")}${escapeHtml(text("zenConsole"))}
                  </a>
                </div>
              </div>
            </section>
          `;
        }

        function getAdvancedFacts(data, mode) {
          const facts = [
            [text("endpointField"), state.endpoint],
            [text("modeField"), getModeLabel(mode)],
            [text("responseStatusField"), state.status === "error" ? text("requestFailed") : text("requestSuccess")],
            [text("lastUpdatedField"), state.lastUpdated ? formatDateTime(state.lastUpdated) : text("neverUpdated")],
            [text("responseKeys"), Object.keys(data || {}).join(", ") || text("noValue")],
          ];

          if (mode === "copilot") {
            facts.push([text("copilotPlan"), data.copilot_plan || text("noValue")]);
            facts.push([text("accessType"), data.access_type_sku || text("noValue")]);
            facts.push([text("resetField"), data.quota_reset_date ? formatDateTime(data.quota_reset_date) : text("noValue")]);
            facts.push([text("chatEnabled"), data.chat_enabled ? text("enabled") : text("disabled")]);
          } else if (mode === "antigravity") {
            facts.push([text("resetField"), data.quota_reset_date ? formatDateTime(data.quota_reset_date) : text("noValue")]);
            facts.push([text("totalModelsField"), formatNumber(Object.keys(data.quota_snapshots?.models || {}).length)]);
          } else if (mode === "zen") {
            facts.push([text("resetField"), text("noValue")]);
            facts.push(["message", data.message || text("zenMessageFallback")]);
          }

          return facts;
        }

        function renderAdvancedPanel(data, mode) {
          const facts = getAdvancedFacts(data, mode)
            .map(
              ([label, value]) => `
                <div class="rounded-2xl bg-[var(--panel)] p-4">
                  <p class="text-xs font-semibold uppercase tracking-[0.08em] text-[var(--muted)]">${escapeHtml(label)}</p>
                  <p class="mt-2 break-all text-sm leading-6 text-[var(--text)] mono">${escapeHtml(value || text("noValue"))}</p>
                </div>
              `,
            )
            .join("");
          const rawJson = data ? JSON.stringify(data, null, 2) : text("jsonEmpty");

          return `
            <section class="dashboard-card p-5 sm:p-6">
              <details class="details-panel" id="advanced-details" ${state.detailsOpen ? "open" : ""}>
                <summary class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <div class="section-title text-xl text-[var(--text)]">
                      <span class="section-icon">${ICONS.data}</span>
                      <span>${escapeHtml(text("advancedTitle"))}</span>
                    </div>
                    <p class="mt-2 text-sm leading-6 text-[var(--muted)]">${escapeHtml(text("advancedBody"))}</p>
                  </div>
                  <span class="pill pill-neutral">${icon("chevron", "details-chevron h-4 w-4")}${escapeHtml(text("detailsSummary"))}</span>
                </summary>

                <div class="space-y-4">
                  <div class="flex flex-wrap gap-2 rounded-full bg-[var(--panel)] p-1">
                    <button type="button" class="tab-button ${state.activeDetailsTab === "summary" ? "is-active" : ""}" data-tab="summary">${escapeHtml(text("detailsSummary"))}</button>
                    <button type="button" class="tab-button ${state.activeDetailsTab === "raw" ? "is-active" : ""}" data-tab="raw">${escapeHtml(text("detailsRaw"))}</button>
                  </div>

                  <div class="tab-panel ${state.activeDetailsTab === "summary" ? "is-active" : ""}" data-panel="summary">
                    <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${facts}</div>
                  </div>

                  <div class="tab-panel ${state.activeDetailsTab === "raw" ? "is-active" : ""}" data-panel="raw">
                    <div class="mb-3 flex items-center justify-between gap-3">
                      <span class="pill pill-neutral">${icon("terminal")}${escapeHtml(text("copyForDebug"))}</span>
                    </div>
                    <div class="code-panel"><pre>${escapeHtml(rawJson)}</pre></div>
                  </div>
                </div>
              </details>
            </section>
          `;
        }

        function bindContentActions() {
          refs.contentArea.querySelectorAll("[data-action='retry']").forEach((button) => {
            button.addEventListener("click", () => fetchData({ preserveContent: true }));
          });
          refs.contentArea.querySelectorAll("[data-action='default']").forEach((button) => {
            button.addEventListener("click", () => {
              setEndpoint(DEFAULT_ENDPOINT);
              updateUrl(DEFAULT_ENDPOINT);
              fetchData({ preserveContent: false });
            });
          });
          const advancedDetails = refs.contentArea.querySelector("#advanced-details");
          if (advancedDetails) {
            advancedDetails.addEventListener("toggle", () => {
              state.detailsOpen = advancedDetails.open;
            });
          }
          refs.contentArea.querySelectorAll("[data-tab]").forEach((button) => {
            button.addEventListener("click", () => {
              state.activeDetailsTab = button.getAttribute("data-tab") || "summary";
              state.detailsOpen = true;
              renderContent();
            });
          });
        }

        function renderAll() {
          renderStaticTexts();
          renderOverview();
          renderStatusBanner();
          renderContent();
          refs.modeChip.textContent = state.data ? getModeLabel(getMode(state.data)) : text("modeChipLabel");
        }

        async function fetchData({ preserveContent = true, endpointOverride } = {}) {
          const endpointSource =
            typeof endpointOverride === "string" ? endpointOverride : refs.endpointInput.value;
          const endpoint = getNormalizedEndpoint(endpointSource);
          if (!endpoint) {
            cancelActiveRequest();
            state.status = "error";
            state.error = text("invalidEndpoint");
            if (!preserveContent) {
              state.data = null;
              state.lastUpdated = null;
            }
            renderAll();
            return;
          }

          const requestId = latestRequestId + 1;
          if (activeRequestController) {
            activeRequestController.abort();
          }
          latestRequestId = requestId;
          const controller = new AbortController();
          activeRequestController = controller;

          setEndpoint(endpoint);
          updateUrl(endpoint);
          state.status = "loading";
          state.error = null;
          renderAll();

          try {
            const response = await fetch(endpoint, { signal: controller.signal });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }
            const data = await response.json();
            if (requestId !== latestRequestId) {
              return;
            }
            state.data = data;
            state.status = "success";
            state.error = null;
            state.lastUpdated = new Date().toISOString();
          } catch (error) {
            if (controller.signal.aborted || requestId !== latestRequestId) {
              return;
            }
            console.error("Failed to fetch usage data", error);
            state.status = "error";
            state.error = error instanceof Error && error.message ? error.message : text("networkErrorFallback");
            if (!preserveContent) {
              state.data = null;
            }
          } finally {
            if (requestId === latestRequestId && activeRequestController === controller) {
              activeRequestController = null;
            }
          }

          if (requestId === latestRequestId) {
            renderAll();
          }
        }

        function handleSubmit(event) {
          event.preventDefault();
          fetchData({ preserveContent: Boolean(state.data) });
        }

        function handleReset() {
          state.activeDetailsTab = "summary";
          setEndpoint(DEFAULT_ENDPOINT);
          updateUrl(DEFAULT_ENDPOINT);
          fetchData({ preserveContent: Boolean(state.data) });
        }

        async function handleExportConfig() {
          const configJson = buildExportConfigJson();
          const copied = await copyTextToClipboard(configJson);

          if (copied) {
            setExportFeedback("exportCopied");
            return;
          }

          setExportFeedback("exportPrompted");
          window.prompt(text("exportManualCopy"), configJson);
        }

        function initialize() {
          refs.endpointForm.addEventListener("submit", handleSubmit);
          refs.resetButton.addEventListener("click", handleReset);
          refs.exportButton.addEventListener("click", handleExportConfig);
          refs.langToggle.addEventListener("click", () => {
            state.language = state.language === "zh" ? "en" : "zh";
            persistPreferences();
            renderAll();
          });

          setEndpoint(state.endpoint);
          renderAll();
          syncAutoRefresh();
          fetchData({ preserveContent: false });
        }

        initialize();
      });
    </script>
  </body>
</html>
