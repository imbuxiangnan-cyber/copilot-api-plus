services:
  copilot-api-plus:
    build:
      context: .
    image: copilot-api-plus:local
    init: true
    command: ["start", "--proxy-env"]
    ports:
      - "127.0.0.1:${COPILOT_API_PORT:-4141}:4141"
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
      COPILOT_API_OVERRIDE: ${COPILOT_API_OVERRIDE:-}
    volumes:
      - copilot-data:/root/.local/share/copilot-api-plus
    restart: unless-stopped

volumes:
  copilot-data:
