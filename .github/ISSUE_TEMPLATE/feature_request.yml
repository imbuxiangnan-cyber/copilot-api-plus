name: 功能建议
description: 描述希望解决的问题、建议的行为及适用范围。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        使用或配置问题请先查看 [支持指南](https://github.com/imbuxiangnan-cyber/copilot-api-plus/blob/main/SUPPORT.md)。
        准备提交实现时，请阅读 [贡献指南](https://github.com/imbuxiangnan-cyber/copilot-api-plus/blob/main/CONTRIBUTING.md)。
        请使用虚构示例，不要包含凭据、accounts.json 或私人对话内容。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述具体使用场景、当前遇到的限制，以及受影响的用户。
      placeholder: 当我……时，需要……；当前的限制是……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明期望的接口、配置项或操作流程，并给出一个示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 已有配置、客户端调整或其他实现能否解决问题？它们有哪些限制？
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 适用范围与兼容性
      description: 涉及哪些协议、客户端、运行环境或账号模式？是否会改变现有接口或默认行为？尚不确定的部分可直接说明。
    validations:
      required: true
